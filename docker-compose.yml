services:
  finagent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: finagent_system
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PORT=3000
      - PYTHONIOENCODING=utf-8
      - STREAM_REPORT_TOKENS=1
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./.env:/app/.env
