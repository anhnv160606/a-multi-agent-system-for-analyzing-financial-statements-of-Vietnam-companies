version: 1
disable_existing_loggers: false

formatters:
  standard:
    format: "%(asctime)s | %(levelname)-8s | %(name)s:%(funcName)s:%(lineno)d - %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"
  json:
    (): src.utils.logger.JSONFormatter

handlers:
  console:
    class: logging.StreamHandler
    level: DEBUG
    formatter: standard
    stream: ext://sys.stdout

  file:
    class: logging.handlers.RotatingFileHandler
    level: DEBUG
    formatter: json
    filename: logs/app.log
    maxBytes: 10485760 # 10MB
    backupCount: 5
    encoding: utf-8

loggers:
  src.ingestion:
    level: DEBUG
    handlers: [console, file]
    propagate: false

  src.chunking:
    level: DEBUG
    handlers: [console, file]
    propagate: false

  src.database:
    level: DEBUG
    handlers: [console, file]
    propagate: false

  src.agents:
    level: DEBUG
    handlers: [console, file]
    propagate: false

  src.orchestrator:
    level: DEBUG
    handlers: [console, file]
    propagate: false

  src.finance:
    level: DEBUG
    handlers: [console, file]
    propagate: false

  src.utils:
    level: DEBUG
    handlers: [console, file]
    propagate: false

root:
  level: INFO
  handlers: [console, file]
