# ==============================================================================
# MULTI-AGENT MODEL CONFIGURATION (HIGH-SPEED BALANCED HYBRID)
# ==============================================================================

# 1. Router Agent: Phân loại câu hỏi siêu tốc (Groq 0.05s)
router:
  provider: "groq"
  model: "qwen/qwen3.8-27b"
  temperature: 0.0

agents:
  # 2. Agent mặc định chung (Groq siêu tốc)
  default:
    provider: "gemini"
    model: "gemini-3.1-flash-lite"
    temperature: 0.2
    max_tokens: 4096

  # 3. Calculator & SQL Agent: Sinh SQL & Code Python (Groq 0.3s)
  calculator:
    provider: "groq"
    model: "qwen/qwen3.8-27b"
    temperature: 0.0 

  # 4. Analysis Agent: Bóc tách DuPont & Sức khỏe tài chính chuyên sâu
  # NOTE: Đổi sang Groq vì GOOGLE_API_KEY hiện tại sai định dạng (AQ.xxx thay vì AIza...)
  # Khi có GOOGLE_API_KEY hợp lệ, đổi lại: provider: "gemini", model: "gemini-3.1-flash-lite"
  analysis:
    provider: "gemini"
    model: "gemini-3.1-flash-lite"
    temperature: 0.2

  # 5. Synthesis Agent: Bóc tách ma trận SWOT & tóm tắt điều hành (Groq siêu tốc)
  synthesis:
    provider: "groq"
    model: "qwen/qwen3.8-27b"
    temperature: 0.2

  # 6. Report Writer Agent: Soạn thảo báo cáo tài chính hoàn chỉnh
  # NOTE: Đổi sang Groq vì GOOGLE_API_KEY hiện tại sai định dạng (AQ.xxx thay vì AIza...)
  # Khi có GOOGLE_API_KEY hợp lệ, đổi lại: provider: "gemini", model: "gemini-3.1-flash-lite"
  report_writer:
    provider: "groq"
    model: "qwen/qwen3.8-27b"
    temperature: 0.4
    max_tokens: 8192

  # 7. Evaluator Agent: Đánh giá chất lượng & độ tin cậy (Groq siêu tốc)
  evaluator:
    provider: "groq"
    model: "qwen/qwen3.8-27b"
    temperature: 0.0